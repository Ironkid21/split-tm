
name: Build Split TM 2.0 for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v2.0.*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: split-tm-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Verify and package Windows app
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Locate Split TM project
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE

          $packages = Get-ChildItem -Path $root `
            -Filter "package.json" -Recurse -File |
            Where-Object {
              $_.FullName -notmatch '[\\/](node_modules|\.git)[\\/]'
            }

          $project = $null

          foreach ($file in $packages) {
            try {
              $config = Get-Content $file.FullName -Raw |
                ConvertFrom-Json

              if ($config.scripts.'dist:win' -and $config.scripts.verify) {
                $project = $file.Directory.FullName
                break
              }
            }
            catch {
              Write-Host "Skipping invalid package file: $($file.FullName)"
            }
          }

          if (-not $project) {
            throw "Could not find the Split TM package.json with dist:win and verify scripts."
          }

          Write-Host "Split TM project directory: $project"
          "PROJECT_DIR=$project" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install locked dependencies
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          npm ci

          if ($LASTEXITCODE -ne 0) {
            throw "Dependency installation failed."
          }

      - name: Run TypeScript checks and automated tests
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          npm run verify

          if ($LASTEXITCODE -ne 0) {
            throw "Verification failed. Fix TypeScript errors or failing tests before packaging."
          }

      - name: Build and package Windows application
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          npm run dist:win

          if ($LASTEXITCODE -ne 0) {
            throw "Windows packaging failed."
          }

      - name: Verify Windows build output
        shell: pwsh
        run: |
          Set-Location "$env:PROJECT_DIR"
          $releaseDir = Join-Path "$env:PROJECT_DIR" "release"

          if (-not (Test-Path $releaseDir)) {
            throw "The release folder was not created."
          }

          $files = @(
            Get-ChildItem -Path $releaseDir -Recurse -File |
              Where-Object {
                $_.Extension -in @(".exe", ".zip")
              }
          )

          if ($files.Count -eq 0) {
            throw "No Windows installer (.exe) or portable archive (.zip) was found."
          }

          Write-Host "Windows build artifacts:"
          $files | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Upload Split TM 2.0 Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: split-tm-2.0-windows
          path: |
            **/release/*.exe
            **/release/*.zip
          if-no-files-found: error
          retention-days: 14
